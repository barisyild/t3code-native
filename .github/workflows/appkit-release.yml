name: AppKit Release

on:
  push:
    tags:
      - "appkit-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing AppKit release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: appkit-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish for Apple Silicon
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          APPKIT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$APPKIT_TAG" =~ ^appkit-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected an AppKit release tag such as appkit-v0.0.1." >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$APPKIT_TAG" "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged AppKit sources
        shell: bash
        env:
          APPKIT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git sparse-checkout set apps/macos
          git fetch --no-tags --depth=1 --filter=blob:none origin "refs/tags/$APPKIT_TAG"
          git checkout --detach FETCH_HEAD

      - name: Build and verify the app archive
        id: package
        shell: bash
        env:
          APPKIT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64

          app=$(sh apps/macos/build.sh --client-only)
          plist="$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$APPKIT_VERSION" "$plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$plist"
          install -m 644 LICENSE "$app/Contents/Resources/T3Code-LICENSE.txt"
          codesign --force --sign - "$app"

          archive="$RUNNER_TEMP/T3-Code-AppKit-$APPKIT_VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          unpacked="$RUNNER_TEMP/appkit-verification"
          ditto -x -k "$archive" "$unpacked"
          verified="$unpacked/$(basename "$app")"
          codesign --verify --deep --strict "$verified"
          lipo -verify_arch arm64 "$verified/Contents/MacOS/T3Code"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$verified/Contents/Info.plist")" = "$APPKIT_VERSION"

          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPKIT_TAG: ${{ steps.release.outputs.tag }}
          APPKIT_VERSION: ${{ steps.release.outputs.version }}
          APPKIT_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/appkit-release-notes.md"
          cat > "$notes" <<'NOTES'
          Native T3 Code client for Apple Silicon Macs running macOS 14 or later.

          Unzip the download and open **T3 Code AppKit.app**. Choose **Pair Environment** to connect to a running T3 server, or [install the `t3` CLI](https://github.com/pingdotgg/t3code#installation) to use **Start Local Server**.

          The app uses an ad-hoc signature. If macOS blocks the first launch, follow [Apple's Open Anyway instructions](https://support.apple.com/en-us/102445).
          NOTES
          gh release create "$APPKIT_TAG" "$APPKIT_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "T3 Code AppKit $APPKIT_VERSION" --notes-file "$notes"
