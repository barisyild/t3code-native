<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Transcript renderer</title>
  <style>
    :root {
      color-scheme: dark;
      background: #111113;
      color: #efeff3;
      --pele-bg: #111113;
      --pele-fg: #efeff3;
      --pele-muted: #b8b8c1;
      --pele-line: #92929b;
      --pele-surface: #232326;
      --pele-surface-alt: #26262a;
      --pele-border: #777781;
      --pele-accent: #d18568;
      --pele-font: system-ui, sans-serif;
    }
    :root[data-appearance="light"] {
      color-scheme: light;
      background: #f5f5f6;
      color: #19191d;
      --pele-bg: #f5f5f6;
      --pele-fg: #19191d;
      --pele-muted: #484850;
      --pele-line: #65656e;
      --pele-surface: #ededf0;
      --pele-surface-alt: #e4e4e8;
      --pele-border: #a2a2ab;
      --pele-accent: #a3482f;
    }
    :root[data-kind="math"] { background: transparent; }
    body { margin: 0; }
    #artwork { display: inline-block; width: max-content; padding: 3px; transform-origin: top left; }
    #artwork.inline { padding: 0 1px; }
    #artwork.inline math { font-size: inherit; }
    math { font-size: 20px; }
    svg { display: block; }
  </style>
</head>
<body>
  <div id="artwork"></div>
  <script src="katex.min.js"></script>
  <script src="pele.global.js"></script>
  <script src="purify.min.js"></script>
  <script src="render.js"></script>
</body>
</html>
